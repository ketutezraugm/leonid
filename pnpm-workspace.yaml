packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  # Bryntum thin trial (shared by Gantt and Calendar): postinstall stamps a trial ID into the package's own JS
  # (fs and crypto only, no network). Reviewed Nov 10, 2026.
  '@bryntum/core-thin-trial': true
  '@bryntum/core-trial-lib': true
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.127'
  - '@ai-sdk/openai-compatible@3.0.79'
  - '@ai-sdk/provider-utils@5.0.69'
  - ai@7.0.154
  - '@ai-sdk/mcp@2.0.85'
  - '@ai-sdk/react@4.0.158'
