packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  # Bryntum trial: postinstall stamps a trial ID into the package's own JS (fs only, no network).
  '@bryntum/gantt-trial': true
  '@bryntum/gantt-trial-lib': true
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.127'
  - '@ai-sdk/openai-compatible@3.0.79'
  - '@ai-sdk/provider-utils@5.0.69'
  - ai@7.0.154
  - '@ai-sdk/mcp@2.0.85'
  - '@ai-sdk/react@4.0.158'
