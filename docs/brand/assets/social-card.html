<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leonid social card</title>
<!-- The 1200x630 link-preview image (Devpost, og:image). Open in a browser and screenshot the card at 100% zoom, or export it with Playwright. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  html, body { margin: 0; background: #12132E; }
  .card { width: 1200px; height: 630px; position: relative; overflow: hidden; background: #12132E; color: #ECEDFB; font-family: "IBM Plex Sans", "Segoe UI", sans-serif; }
  svg.sky { position: absolute; inset: 0; }
  .words { position: absolute; left: 88px; bottom: 96px; display: grid; gap: 18px; }
  .wm { font-family: "Bricolage Grotesque", "Segoe UI", sans-serif; font-weight: 700; font-size: 168px; letter-spacing: -0.03em; line-height: .9; }
  .wm span { color: #FF7AB6; }
  .motto { font-family: "Bricolage Grotesque", "Segoe UI", sans-serif; font-weight: 500; font-size: 44px; color: #ECEDFB; }
  .line { font-size: 22px; color: #A9ABD6; }
  .mark { position: absolute; left: 88px; top: 80px; }
</style>
</head>
<body>
<div class="card">
  <svg class="sky" width="1200" height="630" viewBox="0 0 1200 630" aria-hidden="true">
    <!-- meteor streaks: one slope (65 down per 70 across), falling from the top-right corner -->
    <defs>
      <linearGradient id="m" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7AB6" stop-opacity="0"/><stop offset="1" stop-color="#FF7AB6"/></linearGradient>
      <linearGradient id="p" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9B0F0" stop-opacity="0"/><stop offset="1" stop-color="#A9B0F0"/></linearGradient>
    </defs>
    <line x1="1180" y1="20" x2="900" y2="280" stroke="url(#m)" stroke-width="5" stroke-linecap="round"/><circle cx="900" cy="280" r="8" fill="#FF7AB6"/>
    <line x1="1100" y1="-10" x2="960" y2="120" stroke="url(#p)" stroke-width="3" stroke-linecap="round"/>
    <line x1="1220" y1="190" x2="1080" y2="320" stroke="url(#p)" stroke-width="3" stroke-linecap="round"/>
    <line x1="1010" y1="60" x2="800" y2="255" stroke="url(#m)" stroke-width="4" stroke-linecap="round"/><circle cx="800" cy="255" r="6" fill="#FF7AB6"/>
    <g fill="#ECEDFB" opacity=".55"><circle cx="640" cy="90" r="1.6"/><circle cx="760" cy="420" r="1.4"/><circle cx="1040" cy="470" r="1.8"/><circle cx="560" cy="200" r="1.2"/><circle cx="1130" cy="560" r="1.4"/><circle cx="880" cy="540" r="1.2"/></g>
  </svg>
  <svg class="mark" width="64" height="64" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#1B1D42"/><path d="M26.5 5.5 10.4 19.6 12.6 21.8Z" fill="#FF7AB6"/><circle cx="10.6" cy="21.4" r="3.4" fill="#FF7AB6"/></svg>
  <div class="words">
    <div class="wm">l<span>eo</span>nid</div>
    <div class="motto">Every event, on course.</div>
    <div class="line">An AI agent that runs a community event’s money on PayPal, by your rules.</div>
  </div>
</div>
</body>
</html>
